name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Restaurar (o preparar) el debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Generar el debug keystore si todavía no existe
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Mostrar el SHA-1 (para registrar en Google Cloud)
        run: |
          echo "===================================================="
          echo "SHA-1 del debug keystore (copiar para Google Cloud):"
          keytool -list -v -keystore ~/.android/debug.keystore \
            -alias androiddebugkey -storepass android | grep "SHA1:"
          echo "===================================================="

      - name: Generar las carpetas nativas (android/ios) si faltan
        run: flutter create --platforms=android --org com.freire .

      - name: Sacar el test de ejemplo (si se generó)
        run: rm -f test/widget_test.dart

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar (informativo, no bloquea el build)
        run: flutter analyze || true

      - name: Compilar el APK (debug, firmado con el keystore cacheado)
        run: |
          flutter build apk --debug \
            --dart-define=API_BASE_URL=https://f5-backend-8inv.onrender.com \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=1092181236529-ovdp2jao98d3t2n165tiaccjtqibokmc.apps.googleusercontent.com

      - name: Publicar el APK como Release (descarga directa)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-debug.apk
          body: |
            APK de prueba, firmado con el debug keystore compartido de CI.
            Instalar directo en el celular desde el link de abajo.
