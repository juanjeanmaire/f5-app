name: f5_app
description: App para gestionar partidos de F5, ELO y armado de equipos.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Manejo de estado
  flutter_riverpod: ^2.5.1

  # Navegación declarativa (con redirect automático según sesión)
  go_router: ^14.2.0

  # Cliente HTTP
  dio: ^5.4.3+1

  # Guardar el JWT de forma segura en el dispositivo
  flutter_secure_storage: ^9.2.2

  # Abrir WhatsApp (y otras apps externas) con un mensaje pre-cargado
  url_launcher: ^6.3.0

  # Tipografía de marca (Bebas Neue + Barlow)
  google_fonts: ^6.2.1

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
